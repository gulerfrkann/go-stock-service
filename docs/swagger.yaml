definitions:
  handlers.ReduceStockRequest:
    properties:
      quantity:
        type: integer
    type: object
  models.Product:
    properties:
      ai_cataloged:
        type: boolean
      care_instructions:
        type: string
      category:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      image_url:
        type: string
      name:
        type: string
      price:
        type: number
      seo_title:
        type: string
      stock:
        type: integer
      updated_at:
        type: string
    type: object
  models.ReserveStockRequest:
    properties:
      expiration_secs:
        description: Opsiyonel, gönderilmezse varsayılan süre kullanılır
        type: integer
      order_id:
        type: string
      product_id:
        type: integer
      quantity:
        type: integer
    required:
    - order_id
    - product_id
    - quantity
    type: object
info:
  contact: {}
paths:
  /api/products:
    get:
      description: Sayfa numarası, limit ve arama parametrelerine göre ürünleri listeler.
      parameters:
      - description: 'Sayfa numarası (Varsayılan: 1)'
        in: query
        name: page
        type: integer
      - description: 'Sayfa başına ürün sayısı (Varsayılan: 20)'
        in: query
        name: limit
        type: integer
      - description: Arama kelimesi
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ürün listesi ve sayfalama bilgisi
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Sunucu hatası
          schema:
            additionalProperties: true
            type: object
      summary: Sayfalanmış ve filtrelenmiş ürün listesini döner
      tags:
      - Products
    post:
      consumes:
      - application/json
      description: JSON body ile gelen ürün bilgilerini veritabanına ekler.
      parameters:
      - description: Ürün Bilgileri
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Product'
      produces:
      - application/json
      responses:
        "201":
          description: Oluşturulan ürün
          schema:
            $ref: '#/definitions/models.Product'
        "400":
          description: Geçersiz istek gövdesi
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Kayıt hatası
          schema:
            additionalProperties: true
            type: object
      summary: Sisteme yeni ürün kaydeder
      tags:
      - Products
  /api/products/{id}:
    get:
      description: Ürün ID parametresi ile veritabanından ürün bilgilerini çeker.
      parameters:
      - description: Ürün ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Ürün detayı
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Geçersiz ürün ID
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Ürün bulunamadı
          schema:
            additionalProperties: true
            type: object
      summary: Belirtilen ID'ye sahip ürün detayını getirir
      tags:
      - Products
  /api/products/{id}/image:
    post:
      consumes:
      - multipart/form
      description: Multipart form üzerinden yüklenen görseli sunucuya kaydeder ve
        ProductImageUploaded olayı oluşturur.
      parameters:
      - description: Ürün ID
        in: path
        name: id
        required: true
        type: integer
      - description: Yüklenecek görsel dosyası
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Görsel başarıyla yüklendi
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Geçersiz ID veya eksik dosya
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Kayıt hatası
          schema:
            additionalProperties: true
            type: object
      summary: Ürüne görsel yükler ve AI Outbox olayı tetikler
      tags:
      - Media
  /api/products/{id}/recommendations:
    get:
      description: Redis önbelleğinden veya izole kategori benzerlik matrisinden ilgili
        ürün önerilerini döner.
      parameters:
      - description: Ürün ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Tavsiye listesi
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Ürün bulunamadı
          schema:
            additionalProperties: true
            type: object
      summary: Ürüne özel TF-IDF ve benzerlik tavsiyelerini getirir
      tags:
      - Recommendations
  /api/products/{id}/reduce-stock:
    post:
      consumes:
      - application/json
      description: Redis Lua Script kullanarak yarış koşullarını (race conditions)
        engeller ve stok düşer.
      parameters:
      - description: Ürün ID
        in: path
        name: id
        required: true
        type: integer
      - description: Düşülecek miktar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ReduceStockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Başarılı stok düşüşü
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Yetersiz stok veya geçersiz istek
          schema:
            additionalProperties: true
            type: object
      summary: Belirtilen ürünün stok miktarını doğrudan düşürür
      tags:
      - Stock
  /api/stock/reserve:
    post:
      consumes:
      - application/json
      description: Gelen order_id ile mükerrer kontrolü (idempotency) yaparak stok
        rezerve eder ve pazar yeri sync için outbox kaydı oluşturur.
      parameters:
      - description: Rezervasyon İstek Parametreleri
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ReserveStockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Başarılı rezervasyon
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Geçersiz istek, mükerrer işlem veya yetersiz stok
          schema:
            additionalProperties: true
            type: object
      summary: Idempotent stok rezervasyonu yapar ve Outbox event tetikler
      tags:
      - Stock
swagger: "2.0"
