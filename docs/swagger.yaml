basePath: /api/v1
definitions:
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  models.Product:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      name:
        type: string
      price:
        type: number
      stock:
        type: integer
      updatedAt:
        type: string
    type: object
  models.ReduceStockRequest:
    properties:
      quantity:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Go Fiber ve GORM ile geliştirilmiş stok yönetimi mikroservis API dokümantasyonu.
  title: Stok Servisi API
  version: "1.0"
paths:
  /products:
    get:
      description: 965k ürün arasında hızlı arama (GIN Trigram) ve sayfalama yapar.
      parameters:
      - description: 'Sayfa Numarası (Varsayılan: 1)'
        in: query
        name: page
        type: integer
      - description: 'Sayfa Başına Ürün Miktarı (Varsayılan: 20, Maks: 100)'
        in: query
        name: limit
        type: integer
      - description: Ürün Adında Arama Terimi
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ürünleri Listele ve Ara
      tags:
      - Products
    post:
      consumes:
      - application/json
      description: Sisteme yeni bir ürün kaydeder ve ilgili Redis önbelleklerini temizler.
      parameters:
      - description: Ürün Bilgisi
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/models.Product'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Product'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Yeni Ürün Oluştur
      tags:
      - Products
  /products/{id}/reduce:
    post:
      consumes:
      - application/json
      description: Belirtilen ID'li ürünün stoğunu verilen miktar kadar azaltır.
      parameters:
      - description: Ürün ID
        in: path
        name: id
        required: true
        type: integer
      - description: Düşülecek Miktar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ReduceStockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Stok Düşür
      tags:
      - Products
swagger: "2.0"
