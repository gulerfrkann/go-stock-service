name: Go Stock Service CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build and Run All Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true # İkinci dosyadaki bu özellik build sürelerini ciddi oranda kısaltır

      - name: Install Dependencies
        run: go mod download

      - name: Build Project
        run: go build -v ./... # Hatalı kod varsa testten önce derleme aşamasında yakalar

      - name: Run All Tests
        run: go test -v ./... # Sadece service katmanını değil, tüm repoyu test eder